{% extends "base.html" %}

{% block content %}
<style>
    .documents-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    
    .document-card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        transition: box-shadow 0.3s;
    }
    
    .document-card:hover {
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    .document-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 10px;
    }
    
    .document-name {
        font-size: 16px;
        font-weight: bold;
        color: #333;
        word-break: break-word;
    }
    
    .document-meta {
        font-size: 11px;
        color: #666;
        margin-top: 8px;
    }
    
    .document-description {
        color: #555;
        font-size: 13px;
        margin: 10px 0;
        line-height: 1.4;
    }
    
    .document-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 10px 0;
    }
    
    .tag {
        background: #e9ecef;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 10px;
        color: #495057;
    }
    
    .document-actions {
        display: flex;
        gap: 8px;
        margin-top: 15px;
        flex-wrap: wrap;
    }
    
    .btn-icon {
        padding: 5px 12px;
        font-size: 12px;
    }
    
    .upload-form {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
    }
    
    .upload-form input, .upload-form textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    
    .upload-form textarea {
        resize: vertical;
        min-height: 60px;
    }
    
    .search-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    
    .search-bar input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    
    .usage-badge {
        background: #28a745;
        color: white;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 10px;
    }
</style>

<h2>📚 Библиотека документов</h2>

<div class="upload-form">
    <h3>📤 Загрузить новый документ</h3>
    <form id="uploadDocumentForm">
        <input type="text" id="docName" placeholder="Название документа (обязательно)" required>
        <textarea id="docDescription" placeholder="Описание документа"></textarea>
        <input type="text" id="docTags" placeholder="Теги (через запятую)">
        <input type="file" id="docFile" accept=".pdf" required>
        <button type="submit" class="btn-success">Загрузить</button>
    </form>
</div>

<div class="search-bar">
    <input type="text" id="searchDocs" placeholder="Поиск по названию, описанию, тегам..." oninput="filterDocuments()">
    <button onclick="loadDocuments()" style="background: #667eea;">🔄 Обновить</button>
</div>

<div id="documentsGrid" class="documents-grid">
    <div style="text-align: center; grid-column: 1/-1;">Загрузка документов...</div>
</div>

<script>
let allDocuments = [];

async function loadDocuments() {
    try {
        const response = await fetch('/api/documents_library');
        allDocuments = await response.json();
        renderDocuments(allDocuments);
    } catch (error) {
        console.error('Error loading documents:', error);
        document.getElementById('documentsGrid').innerHTML = '<div style="text-align: center; grid-column: 1/-1; color: red;">❌ Ошибка загрузки</div>';
    }
}

function renderDocuments(documents) {
    const grid = document.getElementById('documentsGrid');
    
    if (documents.length === 0) {
        grid.innerHTML = '<div style="text-align: center; grid-column: 1/-1; color: #999;">📭 Нет документов</div>';
        return;
    }
    
    grid.innerHTML = '';
    documents.forEach(doc => {
        const card = document.createElement('div');
        card.className = 'document-card';
        card.innerHTML = `
            <div class="document-header">
                <div class="document-name">📄 ${escapeHtml(doc.name)}</div>
                <div class="usage-badge">Использований: ${doc.usage_count}</div>
            </div>
            <div class="document-meta">
                Файл: ${doc.original_filename}<br>
                Загружен: ${doc.uploaded_at}<br>
                Размер: ${formatFileSize(doc.file_size)}
            </div>
            ${doc.description ? `<div class="document-description">📝 ${escapeHtml(doc.description)}</div>` : ''}
            ${doc.tags ? `<div class="document-tags">${doc.tags.split(',').map(t => `<span class="tag">${escapeHtml(t.trim())}</span>`).join('')}</div>` : ''}
            <div class="document-actions">
                <button onclick="viewDocument(${doc.id})" class="btn-icon" style="background: #17a2b8;">👁 Просмотр</button>
                <button onclick="editDocument(${doc.id})" class="btn-icon" style="background: #ffc107;">✏ Редактировать</button>
                <button onclick="deleteDocument(${doc.id})" class="btn-icon" style="background: #dc3545;">🗑 Удалить</button>
            </div>
        `;
        grid.appendChild(card);
    });
}

function filterDocuments() {
    const searchTerm = document.getElementById('searchDocs').value.toLowerCase();
    const filtered = allDocuments.filter(doc => 
        doc.name.toLowerCase().includes(searchTerm) ||
        (doc.description && doc.description.toLowerCase().includes(searchTerm)) ||
        (doc.tags && doc.tags.toLowerCase().includes(searchTerm))
    );
    renderDocuments(filtered);
}

function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function viewDocument(documentId) {
    window.open(`/api/documents_library/${documentId}/view`, '_blank');
}

async function editDocument(documentId) {
    const doc = allDocuments.find(d => d.id === documentId);
    if (!doc) return;
    
    const newName = prompt('Название документа:', doc.name);
    if (newName === null) return;
    
    const newDescription = prompt('Описание:', doc.description || '');
    const newTags = prompt('Теги (через запятую):', doc.tags || '');
    
    try {
        const response = await fetch(`/api/documents_library/${documentId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: newName,
                description: newDescription || '',
                tags: newTags || ''
            })
        });
        
        const result = await response.json();
        if (result.success) {
            await loadDocuments();
            alert('Документ обновлен');
        }
    } catch (error) {
        console.error('Error updating document:', error);
        alert('Ошибка обновления');
    }
}

async function deleteDocument(documentId) {
    const doc = allDocuments.find(d => d.id === documentId);
    if (!confirm(`Удалить документ "${doc.name}"?`)) return;
    
    if (doc.usage_count > 0) {
        alert(`Документ прикреплен к ${doc.usage_count} операциям. Сначала открепите его.`);
        return;
    }
    
    try {
        const response = await fetch(`/api/documents_library/${documentId}`, {
            method: 'DELETE'
        });
        
        const result = await response.json();
        if (result.success) {
            await loadDocuments();
            alert('Документ удален');
        } else {
            alert(result.error);
        }
    } catch (error) {
        console.error('Error deleting document:', error);
        alert('Ошибка удаления');
    }
}

// Загрузка документа
document.getElementById('uploadDocumentForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const name = document.getElementById('docName').value;
    const description = document.getElementById('docDescription').value;
    const tags = document.getElementById('docTags').value;
    const file = document.getElementById('docFile').files[0];
    
    if (!name || !file) {
        alert('Заполните название и выберите файл');
        return;
    }
    
    const formData = new FormData();
    formData.append('name', name);
    formData.append('description', description);
    formData.append('tags', tags);
    formData.append('document', file);
    
    try {
        const response = await fetch('/api/documents_library', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        if (result.success) {
            document.getElementById('uploadDocumentForm').reset();
            await loadDocuments();
        } else {
            alert(result.error);
        }
    } catch (error) {
        console.error('Error uploading document:', error);
        alert('Ошибка загрузки');
    }
});



// Загрузка при открытии страницы
loadDocuments();
</script>
{% endblock %}
